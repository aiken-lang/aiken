name: Nix Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  nix-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-15
            system: aarch64-darwin

    runs-on: ${{ matrix.os }}
    name: nix build (${{ matrix.system }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # Magic Nix Cache removed: FlakeHub Cache is unconfigured (no token /
      # `id-token: write` permission

      - name: Flake check
        timeout-minutes: 20
        run: nix flake check --system ${{ matrix.system }}

      - name: Build Aiken
        timeout-minutes: 30
        run: nix build --system ${{ matrix.system }} .#aiken

      - name: Smoke test dev shell
        timeout-minutes: 5
        run: nix develop --system ${{ matrix.system }} -c cargo --version
